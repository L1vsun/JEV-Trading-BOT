[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-trading-bot"
version = "0.2.0"
description = "Live-only order-flow trading bot whose decisions are made by Jev, TypeSafe's System One model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45"]

[project.scripts]
jev-bot = "jev_bot.cli:main"

[tool.setuptools.packages.find]
include = ["jev_bot*"]

[tool.setuptools.package-data]
jev_bot = ["assets/*.html"]
